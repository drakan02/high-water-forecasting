[project]
name = "high-water-forecasting"
version = "0.1.0"
description = "Reproducible tide-gauge ingestion and high-water forecast experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "utide==0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "setuptools>=84.2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
